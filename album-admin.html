
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestione album · Daniele & Francesca</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
  --gold:#aa8747;
  --ink:#463b30;
  --line:#e7dcc7;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:#faf7f0;
  color:var(--ink);
  font-family:'DM Sans',sans-serif;
}
header {
  text-align:center;
  padding:32px 15px;
  background:#fffdf8;
  border-bottom:1px solid var(--line);
}
header strong {
  font:45px 'Great Vibes',cursive;
  color:var(--gold);
}
header p {
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
}
main {
  max-width:1120px;
  margin:30px auto;
  padding:0 18px;
}
h1 {
  font:600 38px 'Cormorant Garamond',serif;
}
button,.link {
  border:0;
  border-radius:8px;
  background:var(--gold);
  color:white;
  padding:11px 15px;
  cursor:pointer;
  font:600 13px 'DM Sans',sans-serif;
  text-decoration:none;
  display:inline-block;
}
button:disabled {
  opacity:.5;
  cursor:wait;
}
.secondary {
  background:#eee6d9;
  color:var(--ink);
}
.danger {
  background:#a24b48;
}
.panel {
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  padding:22px;
  margin:20px 0;
}
.row {
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}
input {
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #d9ccb6;
  border-radius:8px;
  font:inherit;
}
label {font-size:13px}
.muted {
  color:#857b6c;
  font-size:13px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:15px;
}
.card {
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}
.preview {
  height:175px;
  background:#f2ece1;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.preview img,
.preview video {
  width:100%;
  height:100%;
  object-fit:contain;
}
.preview video {
  background:#171717;
}
.body {padding:14px}
.name {
  font-size:13px;
  font-weight:600;
  overflow-wrap:anywhere;
}
.actions {
  display:flex;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}
.actions button {padding:9px}
.hidden {display:none!important}
#notice {
  min-height:20px;
  color:#a24b48;
}
@media(max-width:600px) {
  h1 {font-size:30px}
}
</style>
</head>

<body>

<header>
  <strong>Daniele & Francesca</strong>
  <p>Gestione privata dell'album · 15 maggio 2027</p>
</header>

<main>
  <div class="row">
    <h1>Gestione album</h1>
    <div>
      <a class="link secondary" href="admin.html">
        Torna agli invitati
      </a>
      <button class="secondary hidden" id="logout">
        Esci
      </button>
    </div>
  </div>

  <section class="panel" id="login">
    <h2>Accesso amministratore</h2>
    <form id="form">
      <label>
        Email
        <input id="email" type="email" required autocomplete="username">
      </label>
      <label>
        Password
        <input id="password" type="password" required autocomplete="current-password">
      </label>
      <button>Accedi</button>
    </form>
  </section>

  <section class="hidden" id="app">
    <div class="panel row">
      <div>
        <b id="count">0 file</b>
        <p class="muted">
          Gli originali rimangono privati.
          I link di download scadono dopo 2 minuti.
        </p>
      </div>
      <button id="refresh">Aggiorna</button>
    </div>

    <div id="gallery" class="grid"></div>
  </section>

  <p id="notice" role="status"></p>
</main>

<script type="module">
import {createClient} from
'https://esm.sh/@supabase/supabase-js@2.57.0';

const db=createClient(
  'https://odvbiesoqngieuexoxsl.supabase.co',
  'sb_publishable_83z0XdS72Vv-JOJU2EO6Ww_U47Vu64o'
);

const endpoint=
  'https://odvbiesoqngieuexoxsl.supabase.co/functions/v1/wedding-album-admin';

const $=x=>document.getElementById(x);
const say=x=>$('notice').textContent=x;

async function call(action,more={}) {
  const {data:{session}}=await db.auth.getSession();

  if(!session) {
    throw Error('Effettua nuovamente l’accesso.');
  }

  const res=await fetch(endpoint,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+session.access_token
    },
    body:JSON.stringify({action,...more})
  });

  const data=await res.json();

  if(!res.ok) {
    throw Error(data.error||'Operazione non riuscita');
  }

  return data;
}

async function enter() {
  const {data:{user}}=await db.auth.getUser();
  if(!user)return;

  const {data,error}=await db
    .from('wedding_admins')
    .select('user_id')
    .eq('user_id',user.id)
    .maybeSingle();

  if(error||!data) {
    say('Questo account non è autorizzato.');
    return;
  }

  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('logout').classList.remove('hidden');

  await load();
}

async function load() {
  say('');

  try {
    const {items}=await call('list');

    $('count').textContent=items.length+' file';

    const g=$('gallery');
    g.replaceChildren();

    if(!items.length) {
      g.textContent='Non ci sono ancora fotografie o video.';
      return;
    }

    for(const item of items) {
      const c=document.createElement('article');
      c.className='card';

      const p=document.createElement('div');
      p.className='preview';

      if(item.media_type==='image' && item.preview_url) {
        const img=document.createElement('img');
        img.src=item.preview_url;
        img.alt=item.original_filename||'Fotografia';
        img.loading='lazy';
        p.append(img);

      } else if(item.media_type==='video') {
        const play=document.createElement('button');
        play.textContent='▶ Riproduci video';
        play.className='secondary';

        play.onclick=async()=>{
          play.disabled=true;

          try {
            const {url}=await call('view',{id:item.id});

            const video=document.createElement('video');
            video.src=url;
            video.controls=true;
            video.playsInline=true;
            video.preload='metadata';

            p.replaceChildren(video);
            video.play().catch(()=>{});

          } catch(e) {
            say(e.message);
            play.disabled=false;
          }
        };

        p.append(play);

      } else {
        p.textContent='📷 Anteprima non disponibile';
      }

      const b=document.createElement('div');
      b.className='body';

      const title=document.createElement('div');
      title.className='name';
      title.textContent=item.original_filename||'File';

      const meta=document.createElement('p');
      meta.className='muted';

      meta.textContent=[
        item.uploader_name||'Invitato',
        new Date(item.created_at).toLocaleDateString('it-IT'),
        (item.original_size/1048576).toFixed(2)+' MB'
      ].join(' · ');

      const a=document.createElement('div');
      a.className='actions';

      const down=document.createElement('button');
      down.textContent='Scarica originale';

      down.onclick=async()=>{
        down.disabled=true;

        try {
          const {url}=await call('download',{id:item.id});
          window.open(url,'_blank','noopener');
        } catch(e) {
          say(e.message);
        } finally {
          down.disabled=false;
        }
      };

      const del=document.createElement('button');
      del.className='danger';
      del.textContent='Elimina';

      del.onclick=async()=>{
        if(!confirm(
          'Eliminare definitivamente '+item.original_filename+'?'
        ))return;

        del.disabled=true;

        try {
          await call('delete',{id:item.id});
          await load();
        } catch(e) {
          say(e.message);
          del.disabled=false;
        }
      };

      a.append(down,del);
      b.append(title,meta,a);
      c.append(p,b);
      g.append(c);
    }

  } catch(e) {
    say(e.message);
  }
}

$('form').onsubmit=async e=>{
  e.preventDefault();
  say('Accesso in corso…');

  const {error}=await db.auth.signInWithPassword({
    email:$('email').value,
    password:$('password').value
  });

  if(error) {
    say(error.message);
    return;
  }

  await enter();
};

$('logout').onclick=async()=>{
  await db.auth.signOut();
  location.reload();
};

$('refresh').onclick=load;

enter().catch(e=>say(e.message));
</script>

</body>
</html>
